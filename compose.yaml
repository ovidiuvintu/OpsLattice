
services:
  api:
    build:
      context: .
      dockerfile: src/OpsLattice.Api/Dockerfile
    ports:
      - "5160:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Ollama__BaseUrl: http://host.docker.internal:11434
      Mcp__BaseUrl: http://localhost:8080/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./src/OpsLattice.Web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
